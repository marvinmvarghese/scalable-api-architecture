apiVersion: apps/v1
kind: Deployment
metadata:
  name: hyperblog-app
  labels:
    app: hyperblog
spec:
  replicas: 3 # Start with 3 pods for high availability
  selector:
    matchLabels:
      app: hyperblog
  template:
    metadata:
      labels:
        app: hyperblog
    spec:
      containers:
        - name: app
          image: hyperblog:latest
          imagePullPolicy: Never # Local development image resolution
          env:
            - name: DATABASE_URL
              value: "postgresql+asyncpg://postgres:secretpassword@db:5432/blog_db"
            - name: REDIS_URL
              value: "redis://cache:6379/0"
            - name: CACHE_TTL
              value: "60"
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/stats
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/stats
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: hyperblog-service
  labels:
    app: hyperblog
spec:
  ports:
    - port: 80
      targetPort: 8000
      name: http
  selector:
    app: hyperblog
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hyperblog-hpa
  labels:
    app: hyperblog
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hyperblog-app
  minReplicas: 3
  maxReplicas: 30 # Scale up to 30 pods to hold maximum requests
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
